name: openmedia

networks:
  openmedia: {}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    hostname: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"

  atlasgo:
    image: arigaio/atlas:1.2.3-alpine
    entrypoint:
      - "/bin/sh"
      - "-c"
    command:
      - >
        /atlas migrate hash --dir file:///migrations && /atlas migrate apply --dir file:///migrations --url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/schema.sql:/migrations/000000_init.sql

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: --cluster_mode=emulated --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "redis-cli -a ${REDIS_PASSWORD} ping"

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
    ports:
      - "7700:7700"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -qO- http://127.0.0.1:7700/health"

  redpanda:
    image: redpandadata/redpanda:latest
    environment:
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
    entrypoint:
      - bash
      - -c
    command:
      - |
        rpk redpanda start \
          --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
          --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092 \
          --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082 \
          --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082 \
          --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081 \
          --rpc-addr redpanda:33145 \
          --advertise-rpc-addr redpanda:33145 \
          --mode dev-container \
          --set redpanda.enable_sasl=true \
          --set "redpanda.superusers=[\"$KAFKA_USERNAME\"]" \
          --default-log-level=warn &
        until rpk cluster health 2>/dev/null | grep -q 'Healthy:.*true'; do sleep 1; done
        rpk acl user create "$KAFKA_USERNAME" --password "$KAFKA_PASSWORD" --mechanism scram-sha-256
        wait
    ports:
      - "19092:19092"
      - "18082:18082"
      - "18081:18081"
      - "9644:9644"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD}
    ports:
      - "5080:5080"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -qO- http://127.0.0.1:5080/healthz"
