apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/instance: atlas
    app.kubernetes.io/managed-by: Helmraiser
    app.kubernetes.io/name: atlas-operator
    app.kubernetes.io/version: 0.7.37
    app.tanka.grafana.com: atlas
    helm.sh/chart: atlas-operator-0.7.37
  name: atlas-atlas-operator-manager-role
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - db.atlasgo.io
    resources:
      - atlasmigrations
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - db.atlasgo.io
    resources:
      - atlasmigrations/finalizers
    verbs:
      - update
  - apiGroups:
      - db.atlasgo.io
    resources:
      - atlasmigrations/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - db.atlasgo.io
    resources:
      - atlasschemas
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - db.atlasgo.io
    resources:
      - atlasschemas/finalizers
    verbs:
      - update
  - apiGroups:
      - db.atlasgo.io
    resources:
      - atlasschemas/status
    verbs:
      - get
      - patch
      - update
